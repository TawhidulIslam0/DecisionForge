services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-decisionforge}
      POSTGRES_USER: ${POSTGRES_USER:-decisionforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-decisionforge}
    ports:
      - "5432:5432"
    volumes:
      - decisionforge_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U decisionforge -d decisionforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  ml-service:
    build: ./ml-service
    ports:
      - "8000:8000"
    environment:
      MODEL_NAME: sentence-transformers/all-MiniLM-L6-v2
    volumes:
      - hf_cache:/root/.cache/huggingface

  backend:
    build: ./backend
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://decisionforge:decisionforge@postgres:5432/decisionforge?schema=public
      ML_SERVICE_URL: http://ml-service:8000
      PORT: 4000
      CORS_ORIGIN: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:4000
    depends_on:
      - backend

volumes:
  decisionforge_pg:
  hf_cache:
